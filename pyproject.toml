[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "vision-zero"
version = "0.1.0"
description = "Near-miss and road-risk analysis starter for PS-02 Vision Zero"
requires-python = ">=3.11,<3.13"
dependencies = [
  "numpy==2.2.3",
  "pandas==2.2.3",
  "pyarrow==19.0.1",
  "streamlit==1.42.0",
  "folium==0.19.4",
  "streamlit-folium==0.24.0",
  "plotly==6.0.0",
]

[project.optional-dependencies]
# Offline pipeline only: detection/tracking, SUMO adapters, PDF report.
pipeline = [
  "opencv-python-headless==4.11.0.86",
  "ultralytics==8.4.63",
  "sumolib==1.22.0",
  "pyproj",
  "reportlab==4.3.1",
  "scikit-learn==1.6.1",
]

[project.scripts]
vision-zero = "vision_zero.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
